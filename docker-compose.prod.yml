# Production deployment for a VPS.
#
# Differences from docker-compose.yml (local dev):
#   - Builds the multi-stage Dockerfile.prod images (no source/devDeps in the
#     final image) instead of running `next dev` / `strapi develop` against a
#     bind-mounted source tree.
#   - No source bind mounts — the image is immutable; only data that must
#     persist across deploys (the SQLite file, uploaded media, Traefik's
#     Let's Encrypt state) is a named volume.
#   - restart policies + healthchecks + resource limits, since this is meant
#     to stay up unattended.
#
# HTTPS / reverse proxy: this VPS is dedicated to this project (no sharing
# constraint), so Traefik runs as its own service here and owns ports 80/443
# directly — see DEPLOIEMENT.md section 8. Two hostnames, routed via a static
# file-provider config (traefik/dynamic.yml) rather than the Docker provider:
#   - interformci.com / www.interformci.com → frontend
#   - api.interformci.com → backend
# (Tried the Docker provider first — its bundled client always probes with
# API 1.24, which Docker Engine 29.x refuses outright ("client version 1.24
# is too old, minimum supported 1.40"), and that holds regardless of Traefik
# version or DOCKER_API_VERSION. The file provider sidesteps it entirely:
# Traefik never talks to the Docker API, it just proxies to the containers'
# names on the shared Docker network.)
# This also replaces the single-domain PathPrefix routing used on the old
# shared test VPS (see DEPLOIEMENT.md pitfalls 11.6-11.8, now historical).
# Point both DNS A records at the VPS before starting this stack — Traefik's
# Let's Encrypt HTTP challenge needs them to resolve.
#
# Usage:
#   cp backend/.env.production.example backend/.env.production   # fill in real secrets
#   cp .env.prod.example .env.prod                               # fill in domains
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build

services:
  traefik:
    image: traefik:v3.5
    restart: unless-stopped
    command:
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./traefik/dynamic.yml:/etc/traefik/dynamic/dynamic.yml:ro
      - traefik_letsencrypt:/letsencrypt
    mem_limit: 128m

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    environment:
      - HOST=0.0.0.0
      - PORT=1337
    volumes:
      - backend_data:/app/.tmp
      - backend_uploads:/app/public/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:1337/_health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 768m
    cpus: 1.0
    depends_on:
      - traefik

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_STRAPI_URL: https://${API_DOMAIN}
    restart: unless-stopped
    environment:
      - STRAPI_INTERNAL_URL=http://backend:1337
      - NEXT_PUBLIC_STRAPI_URL=https://${API_DOMAIN}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    mem_limit: 512m
    cpus: 1.0
    depends_on:
      - backend
      - traefik

volumes:
  backend_data:
  backend_uploads:
  traefik_letsencrypt:
