# Production deployment for a VPS.
#
# Differences from docker-compose.yml (local dev):
#   - Builds the multi-stage Dockerfile.prod images (no source/devDeps in the
#     final image) instead of running `next dev` / `strapi develop` against a
#     bind-mounted source tree.
#   - No source bind mounts — the image is immutable; only data that must
#     persist across deploys (the SQLite file, uploaded media) is a named
#     volume.
#   - restart policies + healthchecks + resource limits, since this is meant
#     to stay up unattended.
#
# HTTPS / reverse proxy: this VPS is shared with other projects and already
# runs a single Traefik instance (host network mode, /docker/traefik-rmu2)
# that owns ports 80/443 for the whole box and auto-discovers containers via
# Docker labels (providers.docker, exposedbydefault=false) — see
# DEPLOIEMENT.md. Do NOT add another reverse proxy container here (an
# earlier attempt at a dedicated Caddy container failed: "address already in
# use" on :80). Instead, the services below carry Traefik labels directly.
# A single DOMAIN serves both: the backend router matches Strapi's own URL
# prefixes (higher priority) and the frontend router catches everything else
# on the same Host(). This must list every top-level prefix Strapi's admin
# SPA calls — not just /admin and /api: the Content Manager, Content-Type
# Builder, Upload and Users & Permissions plugins all call bare top-level
# paths (e.g. /content-manager/..., not /admin/content-manager/...). Missing
# one here doesn't 404 — it silently falls through to the frontend's
# catch-all router, which returns its own HTML, breaking that part of the
# admin with a "Unexpected token <, is not valid JSON" error (confirmed
# 04/10/2026: /content-manager was missing, broke the Content Manager tab).
# Point DOMAIN's DNS A/AAAA record at the VPS before starting this stack —
# Traefik's Let's Encrypt HTTP challenge needs it to resolve.
#
# Usage:
#   cp backend/.env.production.example backend/.env.production   # fill in real secrets
#   cp .env.prod.example .env.prod                               # fill in DOMAIN
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    environment:
      - HOST=0.0.0.0
      - PORT=1337
    volumes:
      - backend_data:/app/.tmp
      - backend_uploads:/app/public/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:1337/_health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 768m
    cpus: 1.0
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.interformci-backend.rule=Host(`${DOMAIN}`) && (PathPrefix(`/api`) || PathPrefix(`/admin`) || PathPrefix(`/uploads`) || PathPrefix(`/content-manager`) || PathPrefix(`/content-type-builder`) || PathPrefix(`/upload`) || PathPrefix(`/users-permissions`) || PathPrefix(`/i18n`) || PathPrefix(`/email`))"
      - "traefik.http.routers.interformci-backend.entrypoints=websecure"
      - "traefik.http.routers.interformci-backend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.interformci-backend.priority=10"
      - "traefik.http.services.interformci-backend.loadbalancer.server.port=1337"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_STRAPI_URL: https://${DOMAIN}
    restart: unless-stopped
    environment:
      - STRAPI_INTERNAL_URL=http://backend:1337
      - NEXT_PUBLIC_STRAPI_URL=https://${DOMAIN}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    mem_limit: 512m
    cpus: 1.0
    depends_on:
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.interformci-frontend.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.interformci-frontend.entrypoints=websecure"
      - "traefik.http.routers.interformci-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.interformci-frontend.priority=1"
      - "traefik.http.services.interformci-frontend.loadbalancer.server.port=3000"

volumes:
  backend_data:
  backend_uploads:
