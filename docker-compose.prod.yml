# Production deployment for a VPS.
#
# Differences from docker-compose.yml (local dev):
#   - Builds the multi-stage Dockerfile.prod images (no source/devDeps in the
#     final image) instead of running `next dev` / `strapi develop` against a
#     bind-mounted source tree.
#   - No source bind mounts — the image is immutable; only data that must
#     persist across deploys (the SQLite file, uploaded media, Caddy's TLS
#     state) is a named volume.
#   - restart policies + healthchecks + resource limits, since this is meant
#     to stay up unattended.
#   - Caddy in front, terminating HTTPS automatically (Let's Encrypt) and
#     routing DOMAIN to the frontend and API_DOMAIN to the backend. Point both
#     domains' DNS A/AAAA records at the VPS before starting this stack.
#
# Usage:
#   cp backend/.env.production.example backend/.env.production   # fill in real secrets
#   cp .env.prod.example .env.prod                               # fill in DOMAIN / API_DOMAIN
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    environment:
      - HOST=0.0.0.0
      - PORT=1337
    volumes:
      - backend_data:/app/.tmp
      - backend_uploads:/app/public/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:1337/_health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 768m
    cpus: 1.0

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_STRAPI_URL: https://${API_DOMAIN}
    restart: unless-stopped
    environment:
      - STRAPI_INTERNAL_URL=http://backend:1337
      - NEXT_PUBLIC_STRAPI_URL=https://${API_DOMAIN}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    mem_limit: 512m
    cpus: 1.0
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
      - API_DOMAIN=${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

volumes:
  backend_data:
  backend_uploads:
  caddy_data:
  caddy_config:
